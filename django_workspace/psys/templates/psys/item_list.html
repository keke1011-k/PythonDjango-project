{% extends 'psys/base.html' %}
{% block content %}
<h2>商品一覧</h2>
<div style="margin-bottom: 20px;">
    <a href="{% url 'item_regist' %}" class="btn btn-primary">新規登録</a>
    <a href="{% url 'item_update' %}" class="btn btn-success">更新</a>
    <a href="{% url 'item_delete' %}" class="btn btn-danger">削除</a>
    <a href="{% url 'main_menu' %}" class="btn btn-secondary">メニューに戻る</a>
</div>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>商品コード</th>
            <th>商品名</th>
            <th>単価</th>
            <th>在庫数</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.item_code }}</td>
            <td>{{ item.item_name }}</td>
            <td>¥{{ item.price }}</td>
            <td>{{ item.stock }} 個</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
