{% extends 'psys/base.html' %}
{% block content %}
<h2>新規注文の登録</h2>

<div class="card p-4 shadow-sm">
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">得意先を選択</label>
            <select name="customer_code" class="form-select" required>
                <option value="">-- 選択してください --</option>
                {% for customer in customers %}
                <option value="{{ customer.customer_code }}">
                    {{ customer.customer_name }} ({{ customer.customer_code }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">商品を選択</label>
            <select name="item_code" class="form-select" required>
                <option value="">-- 選択してください --</option>
                {% for item in items %}
                <option value="{{ item.item_code }}">
                    {{ item.item_name }} (単価: ¥{{ item.price }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">数量</label>
            <input type="number" name="quantity" class="form-control" value="1" min="1" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">受注日</label>
                <input type="date" name="order_date" class="form-control" value="{{ today }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">納期</label>
                <input type="date" name="deliver_date" class="form-control" value="{{ today }}" required>
            </div>
        </div>

        <hr>
        <button type="submit" class="btn btn-primary btn-lg w-100">注文を確定する</button>
    </form>
</div>

<div class="mt-3">
    <a href="{% url 'main_menu' %}" class="btn btn-secondary">メニューに戻る</a>
</div>
{% endblock %}
