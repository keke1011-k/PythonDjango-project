{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理システム</title>
    <link rel="stylesheet" href="{% static 'psys/style.css' %}">
</head>
<body>
    <header>
        <h1>管理システム</h1>
        <nav class="user-menu">
            {% if request.session.login_user_id %}
                <span>ようこそ、{{ request.session.login_user_name }} さん</span>
                <a href="{% url 'logout' %}">ログアウト</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
        </ul>
    {% endif %}

    <main>
        <div class="content-box">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
