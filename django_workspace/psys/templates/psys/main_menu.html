{% extends 'psys/base.html' %}
{% block content %}
<h2>管理メニュー</h2>

<div style="display: flex; gap: 20px; margin-bottom: 20px;">
   <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
    <h3>有効得意先数</h3>
    <p style="font-size: 24px; font-weight: bold;">
        <a href="{% url 'customer_list' %}" style="color: blue; text-decoration: none;">
            {{ customer_count }} 件 （詳細を見る）
        </a>
    </p>
</div>
    <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
        <h3>総注文履歴数</h3>
        <p style="font-size: 24px; font-weight: bold;">
    <a href="{% url 'order_list' %}" style="color: green; text-decoration: none;">
        {{ order_count }} 件 （詳細を見る）
    </a>
</p>
   </div>
</div>

<div class="d-grid gap-2 mb-4">
    <a href="{% url 'order_entry' %}" class="btn btn-primary btn-lg">
        🛒 新規注文を入力する
    </a>
</div>

<div class="mb-3">
    <a href="{% url 'customer_management_menu' %}" class="btn btn-primary">得意先管理</a>
    
    <a href="{% url 'item_list' %}" class="btn btn-success">商品管理</a>
    
    <button class="btn btn-secondary" disabled>得意先集計</button>
</div>

{% endblock %}
